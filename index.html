    <!-- Google Helper Functions (Moved to Head) -->
    <script>
        // Google API Config
        const CLIENT_ID = '837113843065-r43b5g2f283ma3393nke4fcf25v0afi8.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyAZ93RRH3OWFFp0stUEXNtnNHZPDgcaMIM';
        const DISCOVERY_DOC = 'https://sheets.googleapis.com/$discovery/rest?version=v4';
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/gmail.send';

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;
        let spreadsheetId = localStorage.getItem('grading_spreadsheet_id') || '';

        // State Management
        let currentUser = null;
        let questions = [];

        // Initialize Google API
        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        async function initializeGapiClient() {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: [DISCOVERY_DOC],
            });
            gapiInited = true;
            maybeEnableButtons();
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // defined later
            });
            gisInited = true;
            maybeEnableButtons();
        }

        function maybeEnableButtons() {
            if (gapiInited && gisInited) {
                console.log("Google API Initialized");
            }
        }

        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID token: " + response.credential);
            const responsePayload = decodeJwtResponse(response.credential);

            currentUser = {
                email: responsePayload.email,
                name: responsePayload.name,
                picture: responsePayload.picture,
                role: 'teacher'
            };

            if (!tokenClient) {
                // If this happens, it means GIS loaded but tokenClient wasn't set up? 
                // Should not happen with onload ordering, but good to check.
                console.warn("tokenClient not ready yet.");
                return;
            }
            requestAccessToken();
        }

        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function requestAccessToken() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    console.error("Auth Error", resp);
                    alert("인증 오류가 발생했습니다: " + JSON.stringify(resp));
                    throw (resp);
                }
                console.log("Access Token Received");
                try {
                    await setupSpreadsheet();
                    showTeacherDashboard();
                } catch (err) {
                    console.error("Spreadsheet Setup Error", err);
                    alert("스프레드시트 설정 중 오류가 발생했습니다. 콘솔을 확인하세요.\n" + (err.result?.error?.message || err.message));
                }
            };

            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        // Functions defined below (setupSpreadsheet, etc.) are available since they are var-hoisted or function declarations
        // but to be safe, we'll keep the core logic/UI stuff in the body script or move it all here.
        // For now, moving ONLY the init/auth stuff here is enough to catch the onload.
    </script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>

        <!-- JS Logic -->
        <script>
            // Google API Config - MOVED TO HEAD
            // The functions gapiLoaded, gisLoaded, initializeGapiClient, checkGapi, etc. 
            // are now in the head to support onload callbacks.

            // Sheets Logic
            async function setupSpreadsheet() {
                if (!spreadsheetId) {
                    try {
                        const response = await gapi.client.sheets.spreadsheets.create({
                            resource: {
                                properties: {
                                    title: "Smart Grading System DB",
                                },
                            },
                        });
                        spreadsheetId = response.result.spreadsheetId;
                        localStorage.setItem('grading_spreadsheet_id', spreadsheetId);
                        console.log("Created Dashboard: " + spreadsheetId);

                        // New sheet needs headers
                        await ensureSheetsExist();

                    } catch (err) {
                        console.error("Error creating spreadsheet", err);
                        // Handle 403 Forbidden specifically?
                        throw err;
                    }
                } else {
                    try {
                        await ensureSheetsExist();
                    } catch (err) {
                        // If 404 (Not Found), maybe ID is invalid or deleted.
                        if (err.status === 404 || (err.result && err.result.error && err.result.error.code === 404)) {
                            if (confirm("기존 스프레드시트를 찾을 수 없습니다. (삭제됨?). 새로 생성하시겠습니까?")) {
                                spreadsheetId = '';
                                localStorage.removeItem('grading_spreadsheet_id');
                                return setupSpreadsheet(); // Retry create
                            }
                        } else {
                            throw err;
                        }
                    }
                }
            }

            async function ensureSheetsExist() {
                // Check existing sheets
                try {
                    const response = await gapi.client.sheets.spreadsheets.get({
                        spreadsheetId: spreadsheetId,
                    });

                    const sheets = response.result.sheets;
                    const sheetTitles = sheets.map(s => s.properties.title);

                    const requiredSheets = ['Quiz', 'answer', 'SCORE'];
                    const requests = [];

                    requiredSheets.forEach(title => {
                        if (!sheetTitles.includes(title)) {
                            requests.push({
                                addSheet: {
                                    properties: {
                                        title: title
                                    }
                                }
                            });
                        }
                    });

                    if (requests.length > 0) {
                        await gapi.client.sheets.spreadsheets.batchUpdate({
                            spreadsheetId: spreadsheetId,
                            resource: {
                                requests: requests,
                            },
                        });
                        console.log("Created missing sheets");
                    }

                    // Initialize headers if needed (simplified)
                } catch (err) {
                    console.error("Error checking sheets", err);
                }
            }

            // Navigation Logic
            function showLogin() {
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('student-login-view').classList.add('hidden');
                document.getElementById('teacher-dashboard').classList.add('hidden');
            }

            function showStudentLogin() {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('student-login-view').classList.remove('hidden');
            }

            function logout() {
                google.accounts.id.disableAutoSelect();
                currentUser = null;
                showLogin();
            }

            function showTeacherDashboard() {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('teacher-dashboard').classList.remove('hidden');
                document.getElementById('teacher-dashboard').classList.add('flex');
                loadDashboardData();
            }

            let allAnswers = [];
            let allScores = [];
            let allQuestions = [];

            async function loadDashboardData() {
                try {
                    console.log("Loading Dashboard Data...");

                    const qRes = await gapi.client.sheets.spreadsheets.values.get({
                        spreadsheetId: spreadsheetId,
                        range: 'Quiz!A2:I'
                    });

                    if (qRes.result.values) {
                        allQuestions = qRes.result.values.map(r => ({
                            id: r[0],
                            group: r[1],
                            type: r[2],
                            points: r[3],
                            content: r[4],
                            answer: r[5],
                            options: r[6],
                            criteria: r[7],
                            explanation: r[8]
                        }));
                    } else {
                        allQuestions = [];
                    }

                    // Load Answers
                    const aRes = await gapi.client.sheets.spreadsheets.values.get({
                        spreadsheetId: spreadsheetId,
                        range: 'answer!A2:F'
                    });

                    if (aRes.result.values) {
                        allAnswers = aRes.result.values.map(r => ({
                            timestamp: r[0], sid: r[1], name: r[2], email: r[3], qId: r[4], answer: r[5]
                        }));
                    } else {
                        allAnswers = [];
                    }

                    // Load Scores
                    const sRes = await gapi.client.sheets.spreadsheets.values.get({
                        spreadsheetId: spreadsheetId,
                        range: 'SCORE!A2:G'
                    });

                    if (sRes.result.values) {
                        allScores = sRes.result.values.map(r => ({
                            sid: r[1], qId: r[3], score: r[4], feedback: r[5]
                        }));
                    } else {
                        allScores = [];
                    }

                    console.log("Data Loaded:", {
                        questions: allQuestions.length,
                        answers: allAnswers.length,
                        scores: allScores.length
                    });

                    // DEBUG: Show user what happened
                    if (allQuestions.length === 0) {
                        alert("로드된 문제가 없습니다 'Quiz' 시트를 확인해주세요.");

                    alert("대시보드 데이터를 불러오는 중 오류가 발생했습니다: " + err.message);

            // ... grading logic ...
            async function runAutoGrading() {
                if (allQuestions.length === 0 || allAnswers.length === 0) {
                    alert("채점할 데이터가 부족합니다.");
                    return;
                }

                const newScores = [];
                const timestamp = new Date().toISOString();

                alert("채점을 시작합니다. 잠시만 기다려주세요...");

                for (const a of allAnswers) {
                    // Check if already graded
                    if (allScores.find(s => s.sid === a.sid && s.qId === a.qId)) continue;

                    const q = allQuestions.find(q => q.id === a.qId);
                    if (!q) continue;

                    let score = 0;
                    let feedback = "";

                    if (q.type === 'essay') {
                        // Call Netlify Function
                        try {
                            const res = await fetch('/.netlify/functions/grade', {
                                method: 'POST',
                                body: JSON.stringify({
                                    question: q.content,
                                    studentAnswer: a.answer,
                                    rubric: q.criteria,
                                    correctAnswer: q.answer,
                                    type: 'essay'
                                })
                            });
                            const data = await res.json();
                            score = data.score;
                            feedback = data.feedback;
                        } catch (e) {
                            console.error('AI Grading Error', e);
                            score = 0;
                            feedback = "AI 채점 실패: " + e.message;
                        }
                    } else {
                        // Simple Match Logic
                        if (a.answer.trim() === q.answer.trim()) {
                            score = q.points;
                            feedback = "정답입니다.";
                        } else {
                            score = 0;
                            feedback = `오답입니다. (정답: ${q.answer}) ${q.explanation}`;
                        }
                    }

                    newScores.push([
                        timestamp,
                        a.sid,
                        a.name,
                        q.id,
                        score,
                        feedback,
                        q.type
                    ]);
                }

                if (newScores.length > 0) {
                    try {
                        await checkAndWriteHeader('SCORE', ["Timestamp", "StudentID", "Name", "Q_ID", "Score", "Feedback", "Type"]);

                        await gapi.client.sheets.spreadsheets.values.append({
                            spreadsheetId: spreadsheetId,
                            range: 'SCORE!A2',
                            valueInputOption: 'RAW',
                            resource: {
                                values: newScores
                            }
                        });

                        alert(`${newScores.length}건의 채점이 완료되었습니다.`);
                        await loadDashboardData(); // Reload
                    } catch (err) {
                        console.error("Save Scores Error", err);
                        alert("점수 저장 실패");
                    }
                } else {
                    alert("새로 채점할 내역이 없습니다.");
                }
            }

            async function sendEmailToStudent(email, name, question, score, feedback) {
                if (!email) {
                    alert("학생 이메일 정보가 없습니다.");
                    return;
                }

                if (!confirm(`${name} 학생에게 채점 결과를 전송하시겠습니까?`)) return;

                const subject = `[채점 결과] ${question.substring(0, 20)}... 문항에 대한 채점 결과입니다.`;
                const body = `
안녕하세요, ${name} 학생.

제출하신 문항에 대한 채점 결과입니다.

[문항]: ${question}
[점수]: ${score}점
[선생님 피드백]:
${feedback}

수고하셨습니다.
            `;

                const utf8Subject = `=?utf-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`;
                const messageParts = [
                    `To: ${email}`,
                    `Subject: ${utf8Subject}`,
                    "Content-Type: text/plain; charset=utf-8",
                    "MIME-Version: 1.0",
                    "",
                    body
                ];
                const message = messageParts.join('\n');
                const encodedMessage = btoa(unescape(encodeURIComponent(message)))
                    .replace(/\+/g, '-')
                    .replace(/\//g, '_')
                    .replace(/=+$/, '');

                try {
                    await gapi.client.gmail.users.messages.send({
                        'userId': 'me',
                        'resource': {
                            'raw': encodedMessage
                        }
                    });
                    alert("이메일이 전송되었습니다.");
                } catch (err) {
                    console.error("Email Send Error", err);
                    alert("이메일 전송 실패: " + (err.result?.error?.message || err.message));
                }
            }

            async function addQuestion() {

                const points = document.getElementById('question-points').value;
                const content = document.getElementById('question-content').value;
                const answer = document.getElementById('question-answer').value;
                const group = document.getElementById('question-group').value || '기본 그룹';
                const explanation = document.getElementById('question-explanation').value;

                    alert("문제 내용, 배점, 정답은 필수입니다.");

                // Collect Rubric

                    const r3 = document.getElementById('rubric-3').value;

                    const r1 = document.getElementById('rubric-1').value;
                    rubric = JSON.stringify({ 5: r5, 4: r4, 3: r3, 2: r2, 1: r1 });
                }

                // Collect Options
                let options = "";
                if (type === 'choice') {
                    options = JSON.stringify(currentOptions);
                }

                const question = {
                    id: Date.now(),
                    group,
                    type,
                    points,
                    content,

                    options,
                    rubric,
                    explanation

                questions.push(question);
                renderQuestions();

                // Clear inputs (Partial clear)

                document.getElementById('question-answer').value = '';
                // Don't clear group to allow continuous entry
                if (type === 'choice') {
                    document.getElementById('options-list').innerHTML = '';

                }
                if (type === 'essay') {

            async function loadQuizFromSheets() {
                try {
                    const response = await gapi.client.sheets.spreadsheets.values.get({
                        spreadsheetId: spreadsheetId,
                        range: 'Quiz!A2:I', // Extended Range for 9 columns
                    });

                    const rows = response.result.values;
                    if (!rows || rows.length === 0) {
                        document.getElementById('student-questions-container').innerHTML = '문제 로드 실패 또는 문제가 없습니다.';
                        return;
                    }

                    // Parse rows: [ID, Group, Type, Points, Question, Answer, Options, Rubric, Explanation]
                    const loadedQuestions = rows.map(row => ({
                        id: row[0],
                        group: row[1],
                        type: row[2],
                        points: row[3],
                        content: row[4],
                        answer: row[5],
                        options: row[6] ? JSON.parse(row[6] || '[]') : [],
                        // Rubric is hidden from student usually, or maybe shown?
                    }));

                    renderStudentQuiz(loadedQuestions);
                } catch (err) {
                    console.error("Error loading quiz", err);
                    alert("문제 로드 실패. (스프레드시트가 '링크가 있는 모든 사용자에게 공개' 설정되어 있는지 확인해주세요.)");
                }
            }

            function renderStudentQuiz(qs) {
                const container = document.getElementById('student-questions-container');
                container.innerHTML = '';

                qs.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = 'card';

                    let inputHtml = '';
                    if (q.type === 'choice') {
                        let optionsHtml = '<div class="flex flex-col gap-2 mt-2">';
                        q.options.forEach((opt, oIdx) => {
                            optionsHtml += `
                            <label class="flex items-center gap-2 cursor-pointer p-2 border border-white/10 rounded hover:bg-white/5">
                                <input type="radio" name="q_${q.id}" value="${opt}">
                                <span>${opt}</span>
                            </label>
                         `;
                        });
                        optionsHtml += '</div>';
                        inputHtml = optionsHtml;
                    } else if (q.type === 'essay') {
                        inputHtml = `<textarea name="q_${q.id}" rows="5" class="w-full mt-2" placeholder="답안을 작성하세요"></textarea>`;
                    } else {
                        inputHtml = `<input type="text" name="q_${q.id}" class="w-full mt-2" placeholder="정답을 입력하세요">`;
                    }

                    div.innerHTML = `
                    <h3 class="text-xl font-bold mb-2">Q${idx + 1}. (${q.points}점) <span class="text-sm text-gray">[${q.group || ''}]</span></h3>
                    <p class="mb-4 text-lg p-2 bg-white/5 rounded">${q.content}</p>
                    ${inputHtml}
                `;
                    container.appendChild(div);
                });
            }

            function toggleEmailInput() {
                const checked = document.getElementById('request-feedback').checked;
                if (checked) {
                    document.getElementById('email-input-section').classList.remove('hidden');
                } else {
                    document.getElementById('email-input-section').classList.add('hidden');
                }
            }

            async function submitQuiz() {
                const sid = document.getElementById('student-id').value;
                const sname = document.getElementById('student-name').value;
                const email = document.getElementById('student-email').value || '';
                const wantFeedback = document.getElementById('request-feedback').checked;

                if (wantFeedback && !email) {
                    alert("이메일을 입력해주세요.");
                    return;
                }

                // Collect answers
                // We need to know question IDs. 
                // I'll re-fetch or use DOM. DOM is safer for what's rendered.
                const inputs = document.querySelectorAll('#student-questions-container [name^="q_"]');
                const answers = [];

                inputs.forEach(input => {
                    const qId = input.name.split('_')[1];
                    answers.push({
                        qId: qId,
                        answer: input.value
                    });
                });

                // Format for Sheets: One row per Student? Or One row per Answer?
                // "Student ID, Name, Answer1, Answer2..." -> Columns dynamic?
                // Or "Student ID, Name, Q_ID, Answer, Email" (Long format)
                // Prompt: "students ... submit ... answers ... stored in 'answer' sheet"
                const timestamp = new Date().toISOString();

                // Apps Script Web App URL
                const APPS_CRIPT_URL = "https://script.google.com/macros/s/AKfycbydEECW1ck2Zx1J452_BuM253u_mobHxT3ic0EEJRhFg8utADEfe7h4hIOa-z5h69gauQ/exec";

                try {
                    // Send one request per answer (or modify Apps Script to accept array - current script handles ONE row per request implies simple logic. 
                    // Wait, script `data` is object. `sheet.appendRow`.
                    // To be safe and efficient, we should loop on client side OR update script to handle array.
                    // Provided script handles SINGLE object: {timestamp, ..., qId, answer}.
                    // So we loop requests.

                    let successCount = 0;

                    // Show loading state
                    const btn = document.querySelector('button[onclick="submitQuiz()"]');
                    const originalText = btn.innerText;
                    btn.innerText = "제출 중...";
                    btn.disabled = true;

                    for (const a of answers) {
                        const payload = {
                            timestamp,
                            sid,
                            sname,
                            email,
                            qId: a.qId,
                            answer: a.answer
                        };

                        // Use fetch with no-cors or standard text/plain to avoid preflight issues if simple
                        // Google Apps Script usually needs 'Content-Type': 'text/plain;charset=utf-8' for POST to work easily without CORS options request failure if not handled well.
                        // But we used 'no-cors' trick usually or just standard fetch.
                        // Let's try standard fetch.

                        await fetch(APPS_CRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors', // Important for opaque response from Google Script
                            headers: {
                                'Content-Type': 'text/plain'
                            },
                            body: JSON.stringify(payload)
                        });
                        successCount++;
                    }

                    alert("제출이 완료되었습니다! 수고하셨습니다.");
                    location.reload();

                } catch (err) {
                    console.error("Submission error", err);
                    alert("제출 중 오류가 발생했습니다. 다시 시도해주세요.");
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            }

            // Initialize
            console.log("App Initialized");
            gapiLoaded();
            gisLoaded();

            // Check link on load
            window.onload = function () {
                setTimeout(checkForStudentLink, 1000); // Small delay to ensure logic loaded
            };
        </script>

        <div id="theme-selector">
            <select onchange="setTheme(this.value)" class="bg-transparent border-none outline-none text-xs p-1 m-0 mb-0"
                style="width: auto; height: auto;">
                <option value="dark">🌙 Dark</option>
                <option value="light">☀️ Light</option>
                <option value="nature">🌿 Nature</option>
                <option value="cyberpunk">👾 Cyber</option>
            </select>
        </div>
